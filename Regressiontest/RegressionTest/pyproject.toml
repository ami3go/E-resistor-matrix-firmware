[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "e-resistor-regression"
version = "2.7.0"
description = "Robot Framework regression harness for E-Resistor firmware"
requires-python = ">=3.10"
dependencies = [
  "robotframework>=7.0,<8.0",
  "pyserial>=3.5",
  "PyVISA>=1.14"
]

[tool.setuptools.packages.find]
include = ["e_resistor_regression*", "robot_framework*"]
